name: Verificar fuentes y recursos
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  paquete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar integridad y exclusión de pesos
        run: python herramientas/verificar_paquete.py
